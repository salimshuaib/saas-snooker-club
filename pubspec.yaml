name: snooker_club
description: "Snooker Club Management System"
publish_to: 'none'
version: 1.0.25+25

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.2.3

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.9

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  gap: ^3.0.1
  fl_chart: ^0.70.1

  # Local Storage
  shared_preferences: ^2.5.5

  # Localization
  intl: ^0.20.2
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  csv: ^8.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  qr_flutter: ^4.1.0
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_tts: ^4.2.5
  audioplayers: ^6.5.1
  alarm: ^5.13.3
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - shorebird.yaml
    - assets/logos/
    - assets/sounds/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logos/app_logo.png"
  adaptive_icon_foreground: "assets/logos/app_logo.png"
  adaptive_icon_background: "#0D1B0E"
